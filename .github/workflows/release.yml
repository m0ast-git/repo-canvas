name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:review
      - run: npm run build
      - name: Check release version
        run: node -e "if ('v'+JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: mkdir -p dist && npm pack --pack-destination dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/repo-canvas-*.tgz'
      - name: Publish the signed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/repo-canvas-*.tgz --verify-tag --generate-notes
